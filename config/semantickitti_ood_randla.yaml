# Config format schema number
format_version: 4

model_params:
  model_architecture: "cylinder_asym"
  model_variant: "randla_native"
  output_shape:
    - 480
    - 360
    - 32
  fea_dim: 4
  out_fea_dim: 256
  num_class: 18
  num_input_features: 16
  use_norm: True
  init_size: 32
  randla_num_neighbors: 16
  randla_sub_sampling_ratio:
    - 4
    - 4
    - 4
    - 4
  randla_d_out:
    - 16
    - 64
    - 128
    - 256
  randla_dropout: 0.5

dataset_params:
  dataset_type: "point_native_dataset_panop"
  pc_dataset_type: "SemKITTI_sk_panop"
  ignore_label: 0
  return_test: False
  unknown_label: 5
  fixed_volume_space: True
  label_mapping: "../config/label_mapping/semantic-kitti.yaml"
  max_volume_space:
    - 50
    - 3.1415926
    - 2
  min_volume_space:
    - 0
    - -3.1415926
    - -4

train_data_loader:
  data_path: "/home/aqy/data/SemanticKITTI/dataset/sequences/"
  imageset: "train"
  return_ref: True
  batch_size: 2
  shuffle: True
  num_workers: 6

val_data_loader:
  data_path: "/home/aqy/data/SemanticKITTI/dataset/sequences/"
  imageset: "val"
  return_ref: True
  batch_size: 1
  shuffle: False
  num_workers: 6

train_params:
  model_load_path: "/home/aqy/myproject/OWSS/DOSS/checkpoints/semantic_kitti/randla_native/best_model.pt"
  model_save_path: "/home/aqy/myproject/OWSS/DOSS/checkpoints/semantic_kitti/randla_native/best_model.pt"
  model_latest_path: "/home/aqy/myproject/OWSS/DOSS/checkpoints/semantic_kitti/randla_native/latest_model.pt"
  checkpoint_every_n_steps: 9565
  max_num_epochs: 20
  eval_every_n_steps: 9565
  learning_rate: 0.001
