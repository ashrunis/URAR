# Config format schema number
format_version: 4

###################
## Model options
model_params:
  model_architecture: "cylinder_asym"

  output_shape:
    - 480
    - 360
    - 32

  fea_dim: 9
  out_fea_dim: 256
  num_class: 17
  num_input_features: 16
  use_norm: True
  init_size: 32


###################
## Dataset options
dataset_params:
  dataset_type: "cylinder_dataset_panop"
  pc_dataset_type: "SemKITTI_sk_panop"
  ignore_label: 0
  return_test: False
  unknown_labels:
    - 18
    - 19
  fixed_volume_space: True
  label_mapping: "../config/label_mapping/semantic-kitti.yaml"
  max_volume_space:
    - 50
    - 3.1415926
    - 2
  min_volume_space:
    - 0
    - -3.1415926
    - -4


###################
## Data_loader options
train_data_loader:
  data_path: "/home/aqy/dataset/SemanticKITTI/dataset/sequences/"
  imageset: "train"
  return_ref: True
  batch_size: 3
  shuffle: True
  num_workers: 6

val_data_loader:
  data_path: "/home/aqy/dataset/SemanticKITTI/dataset/sequences/"
  imageset: "val"
  return_ref: True
  batch_size: 1
  shuffle: False
  num_workers: 6


###################
## Train params
train_params:
  model_load_path: "/home/aqy/myproject/DOSS/checkpoints/semantic_kitti/unk1819/best_model.pt"
  model_save_path: "/home/aqy/myproject/DOSS/checkpoints/semantic_kitti/unk1819/best_model.pt"
  model_latest_path: "/home/aqy/myproject/DOSS/checkpoints/semantic_kitti/unk1819/latest_model.pt"
  checkpoint_every_n_steps: 9565
  max_num_epochs: 20
  eval_every_n_steps: 9565
  learning_rate: 0.001
